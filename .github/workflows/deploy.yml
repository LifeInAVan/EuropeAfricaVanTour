# Builds the website from site/ and publishes it to GitHub Pages on every push to main.
# If a build fails, the live site keeps the previous version.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # one publish at a time; a newer push replaces a waiting one
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
