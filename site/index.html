<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalev's Grand Tour</title>
    <meta name="description" content="Kalev's Grand Tour: from Pärnu to the Sahara and home through the Arctic, 14 months in a VW LT31 camper van." />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1D3B53" />
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <a class="brand" href="#v=home" aria-label="Kalev's Grand Tour, front page">
          <img src="./logo-icon.png" alt="" width="44" height="44" />
          <span class="brand-text">
            <span class="brand-name">Kalev's Grand Tour</span>
            <span class="brand-strap">Pärnu · Sahara · Arctic</span>
          </span>
        </a>
        <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="views" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
        <nav id="views" aria-label="Main"></nav>
        <button type="button" class="start-date" id="start-date" aria-expanded="false" aria-controls="start-pop" aria-label="Change the start date">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          <span id="start-label">Start date</span>
        </button>
        <div class="start-pop" id="start-pop" hidden>
          <label for="start-input">Leave Pärnu on</label>
          <div class="start-row"><input type="date" id="start-input" min="2026-01-01" max="2040-12-31"><button type="button" class="btn small" id="start-apply">Show</button></div>
          <p>Every date, the typical weather and the festival results move with it. The route stays the same.</p>
          <button type="button" class="link" id="start-reset"></button>
        </div>
      </div>
      <nav id="subnav" aria-label="Choose what to show"></nav>
      <div id="filters" aria-label="Types of place"></div>
    </header>
    <div id="home" hidden></div>
    <main class="layout">
      <section id="list" aria-label="Places"></section>
      <aside id="panel" aria-label="Place" hidden></aside>
      <div id="map" role="region" aria-label="Map"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
